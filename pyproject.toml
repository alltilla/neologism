[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--cov=neologism --cov-branch --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "tests/*",
]

[[tool.mypy.overrides]]
module = "setuptools.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
follow_imports = "skip"
ignore_missing_imports = true
